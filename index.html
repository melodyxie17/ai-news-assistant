<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A current AI news briefing collected from three trusted RSS feeds."
    />
    <title>AI News Briefing</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><text y=%22.9em%22 font-size=%2290%22>🟢</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" type="module"></script>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <p class="eyebrow"><span aria-hidden="true"></span> AI News Assistant</p>
        <h1>AI News Briefing</h1>
        <p class="subtitle">
          One calm place for the latest artificial intelligence reporting.
        </p>
      </div>
    </header>

    <main>
      <section class="news-radar" aria-labelledby="news-radar-title">
        <div class="section-heading">
          <div>
            <p class="section-number">01 / DISCOVERY</p>
            <h2 id="news-radar-title">News Radar</h2>
          </div>
          <p class="section-note">WIRED · TechCrunch · VentureBeat</p>
        </div>

        <div class="news-controls">
          <button class="primary-button" id="load-news" type="button">
            <span>Load Latest News</span>
            <span aria-hidden="true">↗</span>
          </button>
          <label class="filter-field" for="news-filter">
            <span>Filter loaded stories</span>
            <input
              id="news-filter"
              type="search"
              placeholder="Try “agents” or “chips”"
              autocomplete="off"
              disabled
            />
          </label>
        </div>

        <p class="news-status" id="news-status" role="status" aria-live="polite">
          Ready when you are. Load the feeds to begin.
        </p>

        <section
          class="deep-read-panel"
          id="deep-read-panel"
          aria-labelledby="deep-read-title"
          aria-live="polite"
          tabindex="-1"
          hidden
        >
          <p class="panel-label">02 / RETRIEVAL</p>
          <div id="deep-read-content"></div>
        </section>

        <div class="article-grid" id="article-list" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <p><strong>RSS</strong> discovers what changed.</p>
      <p><strong>Firecrawl</strong> retrieves a selected webpage.</p>
    </footer>
  </body>
</html>
